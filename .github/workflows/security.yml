name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # Report-only until the open advisories are cleared (see #142); then drop this.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          prune-cache: false
      - run: uv export --frozen --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  npm-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
