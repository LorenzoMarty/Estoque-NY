name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Started for both legs (services cannot be conditional); only the
      # postgres leg points TEST_DATABASE_URL at it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://postgres:postgres@localhost:5432/inventory_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
        if: matrix.db == 'sqlite'
      - run: uv run ruff format --check .
        if: matrix.db == 'sqlite'
      - run: uv run mypy app
        if: matrix.db == 'sqlite'
        continue-on-error: true
      - run: uv run pytest -q --cov
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    # Browser tests (Playwright) against the real API on Postgres. Make this job a
    # required check in the branch protection rules to block merges on failure.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/inventory_e2e
      JWT_SECRET: e2e-only-secret
      CORS_ORIGINS: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run alembic upgrade head
      - name: Start the API
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Build and serve the frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npx vite build
          nohup npx vite preview --host 127.0.0.1 --port 8080 --strictPort > ../front.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the E2E suite
        working-directory: frontend
        run: npx playwright test
      - name: Server logs
        if: failure()
        run: tail -n 80 api.log front.log
      - name: Keep traces and the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

