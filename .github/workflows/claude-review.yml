name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Sem token configurado
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Review pulado. Configure o secret CLAUDE_CODE_OAUTH_TOKEN (rode /install-github-app no Claude Code)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revise este pull request. Escreva tudo em português.
            Leia o CLAUDE.md do repositório, se existir, e siga as convenções dele.

            Foque no que importa, em ordem:
            1. Bugs e regressões (com o cenário concreto que quebra)
            2. Segurança (segredos, injeção, autorização, dados de usuário)
            3. Falta de teste para comportamento novo ou corrigido
            4. Performance (N+1, chamadas de LLM repetidas, consultas sem índice)
            5. Título do PR fora do padrão Conventional Commits

            Não comente estilo que o lint já cobre. Se não achar nada relevante, diga isso em uma linha.
            Use comentários inline para problemas em linhas específicas e um único comentário
            de resumo no PR com `gh pr comment`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
