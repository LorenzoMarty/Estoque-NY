services:
  - type: web
    name: estoque-ny-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      - key: JWT_REFRESH_EXPIRATION_MINUTES
        value: "1440"
      - key: AUTH_ENABLED
        value: "true"
      - key: ALLOW_NEGATIVE_STOCK
        value: "false"
      - key: IDEMPOTENCY_REQUIRED_IN_PRODUCTION
        value: "true"
      # One proxy (Render) in front of the API. Raise to 2 if another proxy (e.g. Vercel)
      # sits before it, or every visitor would share one rate-limit bucket.
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: estoque-ny-front
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: .
  - type: cron
    name: estoque-ny-jobs
    env: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs purge_idempotency_keys
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Same values as the API: settings validation needs them even for a job.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
