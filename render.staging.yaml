# Staging blueprint: create a second Render Blueprint from this file (see docs/staging.md).
# Same shape as render.yaml, own database, own secrets, no crons.
databases:
  - name: estoque-ny-staging-db
    plan: free
    databaseName: estoque_staging

services:
  - type: web
    name: estoque-ny-api-staging
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-ny-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        value: "1"
      # The staging front and the PR previews (*.onrender.com origins), comma-separated.
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: estoque-ny-front-staging
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: .
    envVars:
      - key: VITE_API_URL
        sync: false
